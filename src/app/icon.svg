<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!-- Outer Square Border -->
  <rect x="10" y="10" width="80" height="80" fill="#FFFFFF" stroke="#D3C3A8" stroke-width="2"/>

  <!-- Sunburst / Star Emblem -->
  <g transform="translate(50, 50)" fill="#B88A32">
    <!-- Center Ellipse/Circle -->
    <ellipse cx="0" cy="0" rx="9" ry="6"/>

    <!-- Horizontal Main Rays -->
    <rect x="-24" y="-1.5" width="48" height="3" rx="1.5"/>

    <!-- Vertical Rays -->
    <rect x="-1.5" y="-22" width="3" height="44" rx="1.5"/>

    <!-- Diagonal Rays (Rotated) -->
    <rect x="-1.5" y="-20" width="3" height="40" rx="1.5" transform="rotate(22.5)"/>
    <rect x="-1.5" y="-20" width="3" height="40" rx="1.5" transform="rotate(45)"/>
    <rect x="-1.5" y="-20" width="3" height="40" rx="1.5" transform="rotate(67.5)"/>
    <rect x="-1.5" y="-20" width="3" height="40" rx="1.5" transform="rotate(112.5)"/>
    <rect x="-1.5" y="-20" width="3" height="40" rx="1.5" transform="rotate(135)"/>
    <rect x="-1.5" y="-20" width="3" height="40" rx="1.5" transform="rotate(157.5)"/>
  </g>
</svg>
